version: '3.8'
services:
  dev-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=dev1234
      - POSTGRES_DB=randevium_db
    ports:
      - "5434:5432"
    networks:
      - randevium-net

  test-db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test1234
      - POSTGRES_DB=randevium_db
    ports:
      - "5435:5432"
    networks:
      - randevium-net

networks:
  randevium-net: